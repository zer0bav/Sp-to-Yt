[project]
name = "tunebridge"
version = "0.1.0"
description = "Move playlists between Spotify, YouTube Music, Deezer, Tidal, Apple Music and files using your own browser session. No API keys, no developer accounts."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "zer0bav" }]
keywords = ["spotify", "youtube-music", "playlist", "transfer", "selenium", "deezer", "tidal", "apple-music"]
classifiers = [
  "Environment :: Console",
  "Environment :: Web Environment",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Multimedia :: Sound/Audio",
]
dependencies = [
  "selenium>=4.27",
  "textual>=1.0",
  "fastapi>=0.115",
  "uvicorn>=0.32",
  "rapidfuzz>=3.10",
  "typer>=0.15",
  "platformdirs>=4.3",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "httpx>=0.28", "pytest-asyncio>=0.24"]

[project.scripts]
tunebridge = "tunebridge.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tunebridge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
